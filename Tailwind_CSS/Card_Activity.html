<!DOCTYPE html>
<html lang="en">
<head>

    <title>Activity With Card</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body>
    <div class="border-2 flex justify-center m-4  w-1/2 flex-col border-black items-center h-84">
