<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subscript and superscript</title>
</head>
<body>
    <h1>formulas</h1>
    <p><b>formula of glucose: </b>C<sub>6</sub>H<sub>12</sub>O<sub>6</sub></p>
    <p><u>(a+b)<sup>2</sup>=<b>a<sup>2</sup>+b<sup>2</sup>+2ab</b></u></p>
</body>
</html>
