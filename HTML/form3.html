<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown</title>
</head>
<body>
    <header><h1>Select element in form </h1></header>
    <main>
        <form action="/action">
            <div>
                <label for="district"><b>Q1. </b>Choose your district</label>
                <select name="yourDist." id="district">
                    <option value="" selected>select your opt</option>
                    <option value="Ayodhya">Ayodhya</option>
                    <option value="mahrajganj">mahrajganj</option>
                    <option value="bnaras">bnaras</option>
                    <option value="barabanki">barabanki</option>
                    <option value="pryagraj">pryagraj</option>
                </select><br><br>
            </div><hr>
            <div>
                <h2>
                    range attribute in input element
                </h2>
                <label for="vol">your audible volume level</label><br>
                <input type="range" max="90" min="0" name="volLevel"id="vol">
            </div>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
            <button type="submit"> next</button>
        </form>
    </main>
</body>
</html>
