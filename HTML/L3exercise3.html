<head>
    <meta charset="UTF-8">

    <title>Question no.-3</title>
</head>
<body>
    <header><h1>Feedback form</h1></header>

        <form action="/action">

                <label for="name">Name: </label>

                <br><br>
                <label for="email">E-mail: </label>
                <input type="email" id="email" name="E-mail" placeholder="write your email">
                <br><br>

            </div>
            <div>
                <label for="mass">Message :</label><br>
                <textarea name="sms" id="mass"></textarea>
            </div>
            <div>
                <p>Rate us out of 5 :</p>
                <input type="radio"value="1" name="rating"id="raateme">
                <label for="raateme">1</label><br>
                <input type="radio"value="2" name="rating"id="ratme">
                <label for="ratme">2</label><br>
                <input type="radio"value="3" name="rating"id="ratem">
                <label for="ratem">3</label><br>
                <input type="radio"value="4" name="rating"id="rteme">
                <label for="rteme">4</label><br>
                <input type="radio"value="5" name="rating"id="rateme">
                <label for="rateme">5</label><br>

            <button type="submit">send your Message</button>
        </form>
    </main>
