<!DOCTYPE html>
<html lang="en">
<head>

    <title>name attribute in form</title>
</head>
<body>
    <form action="https://www.youtube.com/results?">
            <div>
                <label for="username">enter username</label>

             </div>
             <div>
                <label for="contact number">phone no.-</label>
                <input type="text" placeholder="enter phone number" id="contact number" name="search_query"><br>
             </div>
             <button>search</button>
    </form>
</body>
</html>
