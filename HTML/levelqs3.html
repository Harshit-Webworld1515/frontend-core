<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registration form</title>
</head>
<body>
    <header><h1>Registration Form</h1></header>
    <main>
        <form action="/action">
            <div>
                <label for="name"></label>
                <input type="text"placeholder="First Name" name="usernaam">
                <input type="text"placeholder="Last Name" name="2ndnaam">
            </div>
            <div>
                <label for="gender">Please select gender</label>
                <select name="gender" id="gender">
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Others</option>
                </select>
            </div>
            <div>
                <label for="">Do you agree with all term of service? </label>
                <input type="checkbox" id="agree" name="isAgree" value="yes" >
                <label for="agree">yes I agree</label>
            </div>
            <button type="submit">Register</button>
        </form>
    </main>
</body>
</html>
